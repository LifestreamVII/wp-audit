# wp-audit CI fixture orchestration.
#
# Brings up a throwaway WordPress + MariaDB pair. The WP container provisions
# its scenario (core/plugins/themes versions) from ci/run/scenario.env, which
# is generated by ci/generate_scenario.py and consumed by the entrypoint.
#
#   WP_SSH_PORT / WP_HTTP_PORT can be overridden from the environment.
#   Both data stores are tmpfs: nothing survives the run.

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp_audit
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wp:
    build:
      context: ..
      dockerfile: ci/Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: wp_audit
      DB_USER: wp
      DB_PASSWORD: wp
    env_file:
      - run/scenario.env
    tmpfs:
      - /var/www/html
    ports:
      - "${WP_SSH_PORT:-3222}:22"
      - "${WP_HTTP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy